name: CI

# Runs on pushes to main, on pull requests and by hand. No schedule on purpose.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7
  # quay.io is the Prometheus project's own registry: same images as Docker Hub,
  # without the anonymous pull limit that runners hit (429 Too Many Requests).
  PROMETHEUS_IMAGE: quay.io/prometheus/prometheus:v3.5.0
  ALERTMANAGER_IMAGE: quay.io/prometheus/alertmanager:v0.28.1
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  KIND_VERSION: v0.27.0
  KIND_NODE_IMAGE: kindest/node:v1.32.2

jobs:
  probe-tests:
    name: Probe unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest (local fake HTTP servers, no real network)
        working-directory: probe
        run: python -m unittest discover -s tests -t . -v

  ruff:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (CI only)
        run: python -m pip install --disable-pip-version-check ruff==0.6.9
      - name: ruff check
        run: ruff check --output-format=github probe

  hadolint:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  helm:
    name: Helm lint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: helm lint
        run: |
          helm lint --strict deploy/helm/fleetwatch
          helm lint --strict deploy/helm/fleetwatch --set serviceMonitor.enabled=true
          helm lint --strict deploy/helm/fleetwatch --set alertmanager.enabled=true
          helm lint --strict deploy/helm/fleetwatch --set alertmanager.enabled=true \
            --set alertmanager.existingSecret=fleetwatch-notifiers \
            --set serviceMonitor.enabled=true --set prometheusRule.enabled=true
      - name: helm template | kubeconform (defaults, Alertmanager disabled)
        run: |
          helm template fleetwatch deploy/helm/fleetwatch --namespace fleetwatch > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 rendered.yaml
          if grep -q 'app.kubernetes.io/component: alertmanager' rendered.yaml; then
            echo "Alertmanager resources rendered although alertmanager.enabled=false"; exit 1
          fi
      - name: helm template | kubeconform (Alertmanager enabled, with a notifier Secret)
        run: |
          helm template fleetwatch deploy/helm/fleetwatch --namespace fleetwatch \
              --set alertmanager.enabled=true --set alertmanager.existingSecret=fleetwatch-notifiers \
            > rendered-am.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 rendered-am.yaml
          for kind in ConfigMap Deployment Service NetworkPolicy; do
            yq ea "select(.kind == \"$kind\" and .metadata.name == \"fleetwatch-alertmanager\") | .metadata.name" rendered-am.yaml \
              | grep -qx fleetwatch-alertmanager || { echo "missing $kind fleetwatch-alertmanager"; exit 1; }
          done
          secret="$(yq ea 'select(.kind == "Deployment" and .metadata.name == "fleetwatch-alertmanager") | .spec.template.spec.volumes[] | select(.name == "secrets") | .secret.secretName' rendered-am.yaml)"
          test "$secret" = "fleetwatch-notifiers"
      - name: helm template | kubeconform (everything on, with ServiceMonitor + PrometheusRule CRD schemas)
        run: |
          helm template fleetwatch deploy/helm/fleetwatch --namespace fleetwatch \
              --set serviceMonitor.enabled=true --set prometheusRule.enabled=true \
              --set alertmanager.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Chart copies match deploy/ (alert rules + Alertmanager config)
        run: |
          set -o pipefail
          # YAML -> JSON with sorted keys, so comments and key order do not matter.
          norm() { yq -o=json 'sort_keys(..)' "$1" > "$2"; test -s "$2"; }
          mkdir -p chart-out
          helm template fleetwatch deploy/helm/fleetwatch --set prometheusRule.enabled=true \
              --show-only templates/prometheusrule.yaml | yq '.spec' > chart-out/alerts.yml
          helm template fleetwatch deploy/helm/fleetwatch --set alertmanager.enabled=true \
              --show-only templates/alertmanager-configmap.yaml | yq '.data["alertmanager.yml"]' > chart-out/alertmanager.yml
          norm deploy/prometheus/alerts.yml chart-out/rules-deploy.json
          norm chart-out/alerts.yml chart-out/rules-chart.json
          norm deploy/alertmanager/alertmanager.yml chart-out/am-deploy.json
          norm chart-out/alertmanager.yml chart-out/am-chart.json
          grep -q FleetWatchCertExpiringSoon chart-out/rules-chart.json
          grep -q '"receiver": "default"' chart-out/am-chart.json
          diff chart-out/rules-deploy.json chart-out/rules-chart.json
          diff chart-out/am-deploy.json chart-out/am-chart.json
          echo "PrometheusRule == deploy/prometheus/alerts.yml, ConfigMap == deploy/alertmanager/alertmanager.yml"
          docker run --rm --entrypoint promtool -v "$PWD/chart-out:/chart:ro" \
            "$PROMETHEUS_IMAGE" check rules /chart/alerts.yml
          docker run --rm --entrypoint amtool -v "$PWD/chart-out:/chart:ro" \
            "$ALERTMANAGER_IMAGE" check-config /chart/alertmanager.yml
      - name: Schema rejects insecure values
        run: |
          reject() {
            if helm template x deploy/helm/fleetwatch "$@" > /dev/null 2>&1; then
              echo "values.schema.json should reject: $*"; exit 1
            fi
            echo "rejected as expected: $*"
          }
          reject --set securityContext.readOnlyRootFilesystem=false
          reject --set alertmanager.enabled=true --set alertmanager.securityContext.readOnlyRootFilesystem=false
          reject --set alertmanager.enabled=true --set alertmanager.securityContext.runAsNonRoot=false
          reject --set alertmanager.enabled=true --set alertmanager.securityContext.allowPrivilegeEscalation=true
          reject --set alertmanager.enabled=true --set 'alertmanager.securityContext.capabilities.drop={NET_RAW}'
          reject --set alertmanager.enabled=true --set alertmanager.podSecurityContext.runAsNonRoot=false
          reject --set alertmanager.enabled=true --set alertmanager.existingSecret=Not_A_Secret_Name
          helm template x deploy/helm/fleetwatch --set alertmanager.enabled=true > /dev/null
          echo "secure defaults still render"

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate

  promtool:
    name: Prometheus + Alertmanager config, rules and rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" check rules /etc/prometheus/alerts.yml
      - name: promtool test rules (alert-rule unit tests)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" test rules \
              /etc/prometheus/tests/target_down_test.yml \
              /etc/prometheus/tests/high_latency_test.yml \
              /etc/prometheus/tests/cert_expiry_test.yml
      - name: amtool check-config
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" \
            "$ALERTMANAGER_IMAGE" check-config /etc/alertmanager/alertmanager.yml

  worker-tests:
    name: Worker tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test
        working-directory: worker
        run: node --test

  docker:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull images from quay.io / mirror.gcr.io (Docker Hub rate-limits runners)
        run: |
          bash .github/scripts/pull-images.sh $(awk '/^FROM /{print $2}' Dockerfile | sort -u)
          bash .github/scripts/pull-images.sh "$TRIVY_IMAGE" || echo "Trivy image not pulled (the scan is report-only)"
      - name: docker build (unit tests run inside the build stage)
        run: docker build -t fleetwatch-probe:ci .
      - name: Image runs as non-root and passes its HEALTHCHECK command
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' fleetwatch-probe:ci)"
          echo "image user: $user"
          test "$user" = "10001:10001"
          docker run -d --name probe -p 8080:8080 --read-only --cap-drop ALL fleetwatch-probe:ci
          for i in $(seq 1 30); do
            if docker exec probe python -m fleetwatch_probe.healthcheck; then break; fi
            sleep 1
          done
          docker exec probe python -m fleetwatch_probe.healthcheck
          curl -sf http://127.0.0.1:8080/healthz
          docker rm -f probe
      - name: Trivy scan (report only, never fails the build)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 0 --no-progress --severity HIGH,CRITICAL --ignore-unfixed \
            fleetwatch-probe:ci | tee trivy.txt
          {
            echo '### Trivy image scan (HIGH/CRITICAL, fixed upstream)'
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-kind:
    name: E2E on kind (Helm install + port-forward)
    runs-on: ubuntu-latest
    needs: [probe-tests, helm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull images from quay.io / mirror.gcr.io (Docker Hub rate-limits runners)
        run: |
          bash .github/scripts/pull-images.sh $(awk '/^FROM /{print $2}' Dockerfile | sort -u) "$KIND_NODE_IMAGE"
      - name: Build image
        run: docker build -t fleetwatch-probe:e2e .
      - uses: helm/kind-action@v1
        with:
          cluster_name: fleetwatch
          # Pinned so the node image is known and pulled above, not from Docker Hub.
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Load image into kind
        run: kind load docker-image fleetwatch-probe:e2e --name fleetwatch
      - name: Notifier Secret for the Alertmanager mount (dummy value)
        run: |
          kubectl create namespace fleetwatch
          kubectl -n fleetwatch create secret generic fleetwatch-notifiers \
            --from-literal=slack_webhook_url=https://hooks.example.invalid/not-a-real-webhook
      - name: helm install (with Alertmanager)
        run: |
          helm install fleetwatch deploy/helm/fleetwatch \
            --namespace fleetwatch --create-namespace \
            --set image.repository=fleetwatch-probe \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set config.intervalSeconds=15 \
            --set alertmanager.enabled=true \
            --set alertmanager.existingSecret=fleetwatch-notifiers \
            --wait --timeout 4m
      - name: Wait for ready
        run: |
          kubectl -n fleetwatch rollout status deployment/fleetwatch --timeout=180s
          kubectl -n fleetwatch rollout status deployment/fleetwatch-alertmanager --timeout=180s
          kubectl -n fleetwatch wait pod -l app.kubernetes.io/component=alertmanager \
            --for=condition=Ready --timeout=120s
          kubectl -n fleetwatch get pods -o wide
      - name: Port-forward and check /healthz, /readyz, /metrics
        run: |
          kubectl -n fleetwatch port-forward svc/fleetwatch 18080:8080 > port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/healthz > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl -sf http://127.0.0.1:18080/healthz)" = "ok"
          curl -sf http://127.0.0.1:18080/readyz
          curl -sf http://127.0.0.1:18080/metrics > metrics.txt
          for family in fleetwatch_probe_up fleetwatch_probe_duration_seconds \
                        fleetwatch_probe_tls_cert_expiry_days fleetwatch_probe_checks_total \
                        fleetwatch_probe_check_failures_total fleetwatch_probe_rounds_total; do
            grep -q "^# TYPE ${family} " metrics.txt || { echo "missing metric family ${family}"; exit 1; }
          done
          grep -q '^# TYPE fleetwatch_probe_duration_seconds histogram$' metrics.txt
          targets="$(grep -c '^fleetwatch_probe_up{' metrics.txt)"
          echo "fleetwatch_probe_up samples: ${targets}"
          test "${targets}" -ge 1
          grep -q '^fleetwatch_probe_rounds_total [1-9]' metrics.txt
          echo "--- sample of /metrics ---"
          grep -E '^fleetwatch_probe_(up|tls_cert_expiry_days)\{' metrics.txt || true
          curl -sf http://127.0.0.1:18080/ | head -c 600; echo
      - name: Alertmanager is Ready and /-/ready answers through a port-forward
        run: |
          ready="$(kubectl -n fleetwatch get pods -l app.kubernetes.io/component=alertmanager \
            -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}')"
          echo "Alertmanager pod Ready=${ready}"
          test "${ready}" = "True"
          kubectl -n fleetwatch port-forward svc/fleetwatch-alertmanager 19093:9093 > am-port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19093/-/ready > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:19093/-/ready; echo
          curl -sf http://127.0.0.1:19093/api/v2/status \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); print("Alertmanager", s["versionInfo"]["version"]); assert "receiver: default" in s["config"]["original"]'
          # The notifier Secret is mounted where the *_file settings look for it.
          mounted="$(kubectl -n fleetwatch exec deployment/fleetwatch-alertmanager -- \
            cat /etc/alertmanager/secrets/slack_webhook_url)"
          test -n "${mounted}"
          echo "notifier Secret mounted at /etc/alertmanager/secrets"
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n fleetwatch get all,networkpolicy,configmap -o wide || true
          kubectl -n fleetwatch describe pods || true
          kubectl -n fleetwatch logs deployment/fleetwatch --tail=200 || true
          kubectl -n fleetwatch logs deployment/fleetwatch-alertmanager --tail=200 || true
          cat port-forward.log || true
          cat am-port-forward.log || true

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull images from quay.io / mirror.gcr.io (Docker Hub rate-limits runners)
        run: |
          bash .github/scripts/pull-images.sh $(awk '/^FROM /{print $2}' Dockerfile | sort -u) \
            $(docker compose config --images | grep -v '^fleetwatch-probe')
      - name: docker compose up
        run: docker compose up -d --build
      - name: Prometheus scrapes the probe (up == 1)
        run: |
          query() {
            curl -sf http://127.0.0.1:9090/api/v1/query --data-urlencode "query=$1"
          }
          for i in $(seq 1 60); do
            if query 'up{job="fleetwatch-probe"}' | python3 -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; sys.exit(0 if r and r[0]["value"][1] == "1" else 1)'; then
              echo "Prometheus sees the probe target as up"; ok=1; break
            fi
            sleep 3
          done
          test "${ok:-0}" = "1"
          query 'count(fleetwatch_probe_up)' | python3 -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print("probe series:", r[0]["value"][1]); sys.exit(0 if int(r[0]["value"][1]) >= 1 else 1)'
      - name: Alert rules are loaded
        run: |
          rules="$(curl -sf http://127.0.0.1:9090/api/v1/rules)"
          for alert in FleetWatchTargetDown FleetWatchHighLatency FleetWatchCertExpiringSoon; do
            echo "$rules" | grep -q "\"$alert\"" || { echo "missing alert $alert"; exit 1; }
          done
      - name: Alertmanager is up with the FleetWatch config
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9093/-/ready > /dev/null; then echo "Alertmanager is ready"; ok=1; break; fi
            sleep 3
          done
          test "${ok:-0}" = "1"
          curl -sf http://127.0.0.1:9093/api/v2/status \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); print("Alertmanager", s["versionInfo"]["version"]); assert "receiver: default" in s["config"]["original"]'
      - name: Prometheus sees Alertmanager (/api/v1/alertmanagers)
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9090/api/v1/alertmanagers \
                | python3 -c 'import json,sys; a=json.load(sys.stdin)["data"]["activeAlertmanagers"]; print(a); sys.exit(0 if any("alertmanager:9093" in x["url"] for x in a) else 1)'; then
              echo "Prometheus has Alertmanager as an active alertmanager"; ok=1; break
            fi
            sleep 3
          done
          test "${ok:-0}" = "1"
      - name: Grafana is up with the provisioned dashboard
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/dashboards/uid/fleetwatch > dashboard.json; then break; fi
            sleep 3
          done
          python3 -c 'import json; d=json.load(open("dashboard.json"))["dashboard"]; print(d["title"], len(d["panels"]), "panels"); assert d["title"] == "FleetWatch"'
          curl -sf http://127.0.0.1:3000/api/datasources/uid/prometheus > /dev/null || curl -sf http://127.0.0.1:3000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: docker compose down
        if: always()
        run: docker compose down -v
