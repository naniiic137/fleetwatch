# Local monitoring stack: probe + Prometheus (with alert rules) + Grafana.
#
#   docker compose up -d --build
#   probe       http://localhost:8080      (/metrics, /healthz, /readyz)
#   Prometheus  http://localhost:9090      (Alerts tab shows the FleetWatch rules)
#   Grafana     http://localhost:3000      (dashboard "FleetWatch", anonymous read-only)

name: fleetwatch

services:
  probe:
    build: .
    image: fleetwatch-probe:local
    restart: unless-stopped
    environment:
      FW_INTERVAL_SECONDS: "30"
      FW_TIMEOUT_SECONDS: "10"
      FW_LOG_LEVEL: "INFO"
    volumes:
      - ./targets.yaml:/etc/fleetwatch/targets.yaml:ro
    ports:
      - "8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      probe:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/fleetwatch.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
