# Alertmanager config for the docker compose stack.
# Checked in CI with: amtool check-config alertmanager.yml
#
# Out of the box every alert goes to the "default" receiver, which has no
# notifier: alerts are grouped and visible at http://localhost:9093 but nothing
# is sent anywhere, so the repo holds no secrets. To get notified, add one of
# the commented notifier blocks below to the "default" receiver (see the README,
# "Plug in email, Slack or Telegram"). Keep secrets in deploy/alertmanager/secrets/
# (git-ignored, mounted at /etc/alertmanager/secrets) and point *_file settings at them.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, target]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Email:
    # email_configs:
    #   - to: you@example.com
    #     from: fleetwatch@example.com
    #     smarthost: smtp.example.com:587
    #     auth_username: fleetwatch@example.com
    #     auth_password_file: /etc/alertmanager/secrets/smtp_password
    #
    # Slack (incoming webhook):
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
    #     channel: "#alerts"
    #     send_resolved: true
    #
    # Telegram (bot token from @BotFather, chat ID of you or your group):
