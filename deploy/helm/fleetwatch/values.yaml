# Default values for the fleetwatch chart. values.schema.json validates them.

image:
  repository: ghcr.io/naniiic137/fleetwatch
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

serviceAccount:
  create: true
  name: ""

# Probe settings, passed to the container as FW_* environment variables.
config:
  intervalSeconds: 30
  timeoutSeconds: 10
  concurrency: 8
  logLevel: INFO

# Sites to check. Rendered into a ConfigMap mounted at /etc/fleetwatch/targets.yaml.
# Same list as targets.yaml at the repository root.
targets:
  - name: portfolio
    url: https://www.hamzabenismail.cloud-ip.cc
    expect_status: 200
    expect_keyword: "Hamza Ben Ismail"
  - name: chkobba
    url: https://chkooba.pages.dev
    expect_status: 200
    expect_keyword: "Chkobba"
  - name: kalak
    url: https://kalak-aar.pages.dev
    expect_status: 200
    expect_keyword: "Kalak"
  - name: fog-chess
    url: https://fog-chess-erb.pages.dev
    expect_status: 200
    expect_keyword: "Fog Chess"
  - name: custom-checkers
    url: https://custom-checkers.pages.dev
    expect_status: 200
    expect_keyword: "Custom Checkers"
  - name: chess-cipher
    url: https://chesscipher.pages.dev
    expect_status: 200
    expect_keyword: "Chess Cipher"
  - name: cipher-chat
    url: https://cipher-chat.pages.dev
    expect_status: 200
    expect_keyword: "CipherChat"
  - name: jobfit-ai
    url: https://jobfit-ai-hbi.pages.dev
    expect_status: 200
    expect_keyword: "JobFit AI"
  - name: readme-glow
    url: https://readme-glow.pages.dev
    expect_status: 200
    expect_keyword: "ReadmeGlow"
  - name: picopulse
    url: https://picopulse.pages.dev
    expect_status: 200
    expect_keyword: "PicoPulse"

service:
  type: ClusterIP
  port: 8080

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

# Ready only after the first probe round has finished.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

networkPolicy:
  enabled: true
  # Extra ingress peers allowed to reach port 8080 (e.g. the Prometheus namespace).
  # Empty = any pod may scrape the probe.
  ingressFrom: []
  # Egress is limited to DNS plus these TCP ports (the probe only makes HTTP(S) calls).
  egressPorts:
    - 80
    - 443

# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# The 3 FleetWatch alert rules (files/alerts.yml, same as deploy/prometheus/alerts.yml)
# as a PrometheusRule. Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
# Add the labels your Prometheus ruleSelector matches (e.g. release: kube-prometheus-stack).
prometheusRule:
  enabled: false
  labels: {}

# Optional Alertmanager, the same one as in the compose stack. Off by default: a
# cluster that runs the Prometheus Operator usually has an Alertmanager already.
alertmanager:
  enabled: false
  image:
    # The image compose runs (prom/alertmanager), from the Prometheus project's own
    # registry, which has no anonymous pull limit.
    repository: quay.io/prometheus/alertmanager
    tag: v0.28.1
    pullPolicy: IfNotPresent
  # Full alertmanager.yml as a string. Empty = files/alertmanager.yml, which is the
  # compose config: one route grouped by alertname + target into a "default"
  # receiver with no notifier.
  config: ""
  # Name of an existing Secret with notifier credentials (SMTP password, Slack
  # webhook URL, Telegram bot token). Mounted read-only at /etc/alertmanager/secrets,
  # for the *_file settings in the config. Empty = nothing mounted.
  existingSecret: ""
  service:
    type: ClusterIP
    port: 9093
  # The image runs as nobody (65534).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /-/healthy
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /-/ready
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  networkPolicy:
    enabled: true
    # Extra ingress peers allowed to reach port 9093 (e.g. the Prometheus namespace).
    # Empty = any pod may reach it.
    ingressFrom: []
    # Egress is limited to DNS plus these TCP ports: 443 for webhook notifiers
    # (Slack, Telegram), 587 for SMTP submission. Empty = DNS only.
    egressPorts:
      - 443
      - 587
