# Alertmanager config for the Helm chart (alertmanager.enabled=true).
# Same settings as deploy/alertmanager/alertmanager.yml in the compose stack:
# CI fails if the two files stop matching (comments aside).
#
# Out of the box every alert goes to the "default" receiver, which has no
# notifier: alerts are grouped and visible on port 9093 but nothing is sent
# anywhere, so the chart holds no secrets. To get notified, put the credentials
# in a Kubernetes Secret, set alertmanager.existingSecret to its name (it is
# mounted at /etc/alertmanager/secrets) and pass a full config with a notifier
# block in alertmanager.config (see the README, "Alertmanager on Kubernetes").

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, target]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Email:
