{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleetwatch.alertmanager.fullname" . }}
  labels:
    {{- include "fleetwatch.alertmanager.labels" . | nindent 4 }}
spec:
  type: {{ .Values.alertmanager.service.type }}
  ports:
    - name: http
      port: {{ .Values.alertmanager.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "fleetwatch.alertmanager.selectorLabels" . | nindent 4 }}
{{- end }}
