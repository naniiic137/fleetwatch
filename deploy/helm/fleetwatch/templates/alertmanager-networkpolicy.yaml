{{- if and .Values.alertmanager.enabled .Values.alertmanager.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fleetwatch.alertmanager.fullname" . }}
  labels:
    {{- include "fleetwatch.alertmanager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fleetwatch.alertmanager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Only the web/API port (Prometheus pushes alerts, people open the UI).
  # The gossip port 9094 is never opened: clustering is off.
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.alertmanager.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.alertmanager.networkPolicy.egressPorts }}
    # Notifiers: HTTPS webhooks (Slack, Telegram) and SMTP submission
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
