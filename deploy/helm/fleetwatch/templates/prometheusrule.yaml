{{- if .Values.prometheusRule.enabled }}
# The 3 FleetWatch alert rules from files/alerts.yml (same as deploy/prometheus/alerts.yml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "fleetwatch.fullname" . }}
  labels:
    {{- include "fleetwatch.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/alerts.yml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
